faq_titulo=Questions fréquentes
faq_q1=Comment passer une commande ?
faq_a1=Ajoutez les produits au panier, écrivez votre nom et envoyez la commande sur WhatsApp. L'usine confirme la disponibilité et le mode de paiement.
faq_q2=Où puis-je acheter ?
faq_a2=Dans nos points de vente de Fortalecillas (Huila) et de Bogotá, et via les tournées de distribution dans le Huila.
faq_q3=Quels sont vos horaires ?
faq_a3=Le point de Fortalecillas est ouvert de 8 h à 19 h, sans interruption. Pour les autres points, écrivez-nous sur WhatsApp.
faq_q4=De quoi sont faits les bizcochos d'achira ?
faq_a4=De fromage, farine de sagú, œufs, panela, sel, colorant et beurre. Nous les façonnons à la main et les cuisons dans un four en terre.
faq_q5=Puis-je voir le site dans une autre langue ?
faq_a5=Oui. Utilisez les boutons ES, EN ou FR du menu pour le voir en espagnol, en anglais ou en français.
