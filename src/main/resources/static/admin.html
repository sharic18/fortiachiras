<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel administrativo | Fortiachiras</title>
  <link rel="icon" href="img/logotipo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#principal">Saltar al contenido</a>

  <!-- Vista de inicio de sesión -->
  <main id="vistaLogin" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Panel administrativo</h1>
            <p class="text-center text-muted mb-4">Fortiachiras</p>
            <div id="errorLogin" class="alert alert-danger d-none" role="alert"></div>
            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" autocomplete="username" required autofocus>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-ladrillo w-100">Iniciar sesión</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="index.html">Volver al sitio</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Vista del panel -->
  <div id="vistaPanel" class="d-none">
    <nav class="navbar navbar-bizcocho" aria-label="Panel">
      <div class="container">
        <span class="navbar-brand">Panel administrativo</span>
        <div class="d-flex align-items-center gap-3">
          <span id="nombreUsuario" class="text-light small"></span>
          <button id="btnReporte" type="button" class="btn btn-warning btn-sm">Reporte PDF</button>
          <a class="btn btn-outline-light btn-sm" href="index.html" target="_blank" rel="noopener">Ver sitio</a>
          <button id="btnSalir" type="button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </div>
      </div>
    </nav>

    <main id="principal" class="container py-4">
      <div id="alerta" class="alert d-none" role="status" aria-live="polite"></div>
      <ul id="tabs" class="nav nav-pills mb-3 flex-wrap" aria-label="Módulos"></ul>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 id="tituloModulo" class="h4 mb-0"></h1>
        <button id="btnNuevo" type="button" class="btn btn-ladrillo">+ Nuevo</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
          <caption id="captionTabla" class="visually-hidden"></caption>
          <thead id="tablaHead"></thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Formulario (crear / editar) -->
  <div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="modalFormTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <form id="formRegistro" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalFormTitulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="errorForm" class="alert alert-danger d-none" role="alert"></div>
          <div id="camposForm"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-ladrillo">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
