spring.application.name=huila-bizcochos

# ===== Base de datos (PostgreSQL / pgAdmin) =====
# DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bizcochos_huila}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Seguridad JWT =====
# JWT_SECRET
app.jwt.secret=${JWT_SECRET:DGw32sD4fHFTNQFKucw4sg3rwFrIJP7wtwMZsliGgjvZ3ZsPXREp9kzHDPr8Ww0v}
app.jwt.expiration-ms=7200000

# ===== Internacionalizacion nativa (Spring MessageSource) =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== HTTPS (certificado autofirmado para desarrollo local) =====
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit

