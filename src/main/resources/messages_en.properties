faq_titulo=Frequently asked questions
faq_q1=How do I place an order?
faq_a1=Add the products to the cart, write your name and send the order on WhatsApp. The factory confirms availability and payment method.
faq_q2=Where can I buy?
faq_a2=At our points of sale in Fortalecillas (Huila) and Bogotá, and through the distribution routes across Huila.
faq_q3=What are your opening hours?
faq_a3=The Fortalecillas point is open from 8:00 a.m. to 7:00 p.m., all day. For the other points, write to us on WhatsApp.
faq_q4=What are the achira bizcochos made of?
faq_a4=Cheese, sagú flour, eggs, panela, salt, food coloring and butter. We shape them by hand and bake them in a clay oven.
faq_q5=Can I see the site in another language?
faq_a5=Yes. Use the ES, EN or FR buttons in the menu to see it in Spanish, English or French.
