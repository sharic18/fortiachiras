faq_titulo=Preguntas frecuentes
faq_q1=¿Cómo hago un pedido?
faq_a1=Agrega los productos al carrito, escribe tu nombre y envía el pedido por WhatsApp. La fábrica confirma la disponibilidad y la forma de pago.
faq_q2=¿Dónde puedo comprar?
faq_a2=En nuestros puntos de venta de Fortalecillas (Huila) y de Bogotá, y a través de las rutas de distribución que recorren el Huila.
faq_q3=¿Cuál es el horario de atención?
faq_a3=El punto de Fortalecillas atiende de 8:00 a. m. a 7:00 p. m., en jornada continua. Para los demás puntos, escríbenos por WhatsApp.
faq_q4=¿De qué están hechos los bizcochos de achira?
faq_a4=De queso, harina de sagú, huevos, panela, sal, color y mantequilla. Los moldeamos a mano y los asamos en horno de barro.
faq_q5=¿Puedo ver el sitio en otro idioma?
faq_a5=Sí. Usa los botones ES, EN o FR del menú para verlo en español, inglés o francés.
